name: CI

on:
  # Branch pushes are covered by pull_request once a PR is open; listing every
  # branch here as well ran the whole suite twice for each push.
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # node:sqlite requires >= 22.5.
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm_config_allow_scripts='' npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
