# mailsift — start with:  docker compose up -d
# Then read the setup address and one-time code from:  docker compose logs mailsift
#
# Nothing here reads a .env file: every setting is made in the web view and
# stored in the volumes below. See docs/deployment.md.
services:
  mailsift:
    # The published image. See docker-compose.build.yml to build from this checkout instead.
    image: ghcr.io/itswl/mailsift:latest
    pull_policy: missing
    container_name: mailsift
    restart: unless-stopped
    init: true
    ports:
      # Only this machine can reach it. From elsewhere, use an SSH tunnel
      # (ssh -N -L 8410:127.0.0.1:8410 you@server) or an HTTPS reverse proxy.
      - "127.0.0.1:8410:8410"
    volumes:
      # The database: settings, encrypted credentials and triage records.
      - mailsift-data:/app/data
      # The key the credentials are encrypted with. Back both up; neither is
      # of use without the other.
      - mailsift-secrets:/app/secrets
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Lets the current poll finish after a stop.
    stop_grace_period: 60s

volumes:
  mailsift-data:
  mailsift-secrets:
