services:
  mailsift:
    # Pull the published image. See docker-compose.build.yml to build from source.
    image: ghcr.io/itswl/mailsift:${MAILSIFT_VERSION:-1.0.0}
    pull_policy: missing
    container_name: mailsift
    restart: unless-stopped
    env_file: .env
    ports:
      # Publish on the host loopback by default; the application listens on all
      # container interfaces so Docker can forward the published port.
      - "${MCP_PUBLIC_HOST:-127.0.0.1}:${MCP_PORT:-8410}:${MCP_PORT:-8410}"
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - NODE_OPTIONS=--dns-result-order=ipv4first
      # MCP is embedded in the main process and enabled by default.
      - MCP_ENABLED=${MCP_ENABLED:-true}
      - MCP_BIND=${MCP_BIND:-0.0.0.0}
      - MCP_PORT=${MCP_PORT:-8410}
      - MCP_TOKEN=${MCP_TOKEN:-}

    volumes:
      # Use a named volume because the container runs as uid 10001 and a root-owned
      # host bind mount would not be writable.
      - mailsift-data:/app/data

    # Logs go to stdout; rotate them or they will eventually fill the disk.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    # Finish the current poll after SIGTERM to avoid inconsistent cursors.
    stop_grace_period: 60s

volumes:
  mailsift-data:
